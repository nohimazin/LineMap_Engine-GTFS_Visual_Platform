<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>停留所検索テスト</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .test-case {
      margin-bottom: 20px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    .pass {
      background-color: #d4edda;
      border-color: #c3e6cb;
      color: #155724;
    }
    .fail {
      background-color: #f8d7da;
      border-color: #f5c6cb;
      color: #721c24;
    }
    .result {
      font-weight: bold;
    }
    .details {
      font-size: 0.9em;
      margin-top: 5px;
    }
    #summary {
      font-size: 1.2em;
      font-weight: bold;
      margin-bottom: 30px;
      padding: 15px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>停留所検索 ロジックテスト</h1>
  <div id="summary"></div>
  <div id="results"></div>

  <script>
    // Mock state matching app.js
    const state = {
      rawStops: {
        features: [
          {
            type: "Feature",
            properties: {
              stop_id: "S001",
              stop_name: "Central Station",
              stop_lat: 35.6812,
              stop_lon: 139.7671
            }
          },
          {
            type: "Feature",
            properties: {
              stop_id: "S002",
              stop_name: "Shinjuku Station",
              stop_lat: 35.6896,
              stop_lon: 139.7006
            }
          },
          {
            type: "Feature",
            properties: {
              stop_id: "S003",
              stop_name: "Shibuya Crossing",
              stop_lat: 35.6595,
              stop_lon: 139.7004
            }
          },
          {
            type: "Feature",
            properties: {
              stop_id: "S004",
              stop_name: "東京駅",
              stop_lat: 35.6812,
              stop_lon: 139.7671
            }
          }
        ]
      }
    };

    // Helper functions from app.js
    function normalizeDisplayText(value) {
      const text = String(value ?? "").trim();
      if (!text) return "";
      const lower = text.toLowerCase();
      if (lower === "null" || lower === "none" || lower === "nan" || text === "-") {
        return "";
      }
      return text;
    }

    // Implementation matching app.js performStopSearch
    function performStopSearch(query) {
      const normalizedQuery = normalizeDisplayText(query).toLowerCase();
      if (!normalizedQuery) {
        return [];
      }
      return (state.rawStops.features || [])
        .filter((feature) => {
          const properties = feature?.properties || {};
          const stopName = normalizeDisplayText(properties.stop_name).toLowerCase();
          const stopId = normalizeDisplayText(properties.stop_id).toLowerCase();
          return stopName.includes(normalizedQuery) || stopId.includes(normalizedQuery);
        })
        .slice(0, 30);
    }

    // Test cases
    const testCases = [
      {
        name: "1文字入力で部分一致フィルタリング",
        query: "central",
        expectedCount: 1,
        expectedNames: ["Central Station"]
      },
      {
        name: "大文字小文字区別なし",
        query: "CENTRAL",
        expectedCount: 1,
        expectedNames: ["Central Station"]
      },
      {
        name: "日本語停留所検索",
        query: "東京",
        expectedCount: 1,
        expectedNames: ["東京駅"]
      },
      {
        name: "空白入力で空結果",
        query: "   ",
        expectedCount: 0,
        expectedNames: []
      },
      {
        name: "複数文字マッチング",
        query: "station",
        expectedCount: 2,
        expectedNames: ["Central Station", "Shinjuku Station"]
      },
      {
        name: "stop_id での検索",
        query: "S002",
        expectedCount: 1,
        expectedNames: ["Shinjuku Station"]
      },
      {
        name: "該当なしのキーワード",
        query: "Yokohama",
        expectedCount: 0,
        expectedNames: []
      }
    ];

    // Run tests
    let passed = 0;
    let failed = 0;
    const resultsDiv = document.getElementById("results");

    testCases.forEach((testCase) => {
      const results = performStopSearch(testCase.query);
      const resultNames = results.map(r => r.properties.stop_name);
      
      const countMatches = results.length === testCase.expectedCount;
      const namesMatch = testCase.expectedNames.every(name => resultNames.includes(name));
      const isPass = countMatches && namesMatch;

      if (isPass) {
        passed++;
      } else {
        failed++;
      }

      const testDiv = document.createElement("div");
      testDiv.className = `test-case ${isPass ? "pass" : "fail"}`;
      testDiv.innerHTML = `
        <div class="result">${isPass ? "✓ PASS" : "✗ FAIL"}: ${testCase.name}</div>
        <div class="details">クエリ: "${testCase.query}"</div>
        <div class="details">期待結果: ${testCase.expectedCount} 件 (${testCase.expectedNames.join(", ") || "なし"})</div>
        <div class="details">実際の結果: ${results.length} 件 (${resultNames.join(", ") || "なし"})</div>
      `;
      resultsDiv.appendChild(testDiv);
    });

    const summaryDiv = document.getElementById("summary");
    summaryDiv.className = failed === 0 ? "pass" : "fail";
    summaryDiv.textContent = `テスト結果: ${passed}/${testCases.length} 成功 (${failed} 失敗)`;
  </script>
</body>
</html>
